
name: Build NinjaReplica APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          unzip -o NinjaReplica-Android-Source.zip -d extracted
          find extracted -name settings.gradle -type f

      - name: Fix Java and Kotlin JVM targets
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle -type f | head -n 1)")"
          FILE="$PROJECT_DIR/app/build.gradle"
          cat >> "$FILE" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
              kotlinOptions {
                  jvmTarget = '21'
              }
          }
          EOF

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle -type f | head -n 1)")"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NinjaReplica-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
