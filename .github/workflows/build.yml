
name: Build NinjaReplica APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check source ZIP
        run: |
          test -f NinjaReplica-Billiards-Demo-Source.zip
          unzip -t NinjaReplica-Billiards-Demo-Source.zip

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -o NinjaReplica-Billiards-Demo-Source.zip -d extracted
          find extracted -name settings.gradle -type f

      - name: Configure Android project
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle -type f | head -n 1)")"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android project or app/build.gradle not found"
            exit 1
          fi

          FILE="$PROJECT_DIR/app/build.gradle"

          if ! grep -q "sourceCompatibility JavaVersion.VERSION_21" "$FILE"; then
            cat >> "$FILE" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
              kotlinOptions {
                  jvmTarget = '21'
              }
          }
          EOF
          fi

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle -type f | head -n 1)")"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NinjaReplica-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
